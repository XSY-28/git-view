name: Unsigned desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: macOS full tests including HTTP transport
        if: runner.os == 'macOS'
        run: pnpm test
      - name: Windows core Git and stdio tests (HTTP fallback is POSIX only)
        if: runner.os == 'Windows'
        run: pnpm exec vitest run --exclude tests/integration/transport.test.ts
      - name: macOS desktop installation and recovery tests
        if: runner.os == 'macOS'
        run: pnpm test:install-desktop
      - run: pnpm build
      - run: node scripts/build-desktop.mjs --prepare-only
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: node scripts/build-desktop.mjs
      - if: runner.os == 'macOS'
        run: node scripts/verify-installed.mjs --app "apps/desktop/src-tauri/target/release/bundle/macos/Git View.app" --output installed-verification.json
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/desktop-portable
          Copy-Item apps/desktop/src-tauri/target/release/git-view-desktop.exe dist/desktop-portable/
          Copy-Item apps/desktop/src-tauri/resources/* dist/desktop-portable/ -Recurse
          node scripts/verify-installed.mjs --app dist/desktop-portable --output installed-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            dist/desktop-portable/
            installed-verification.json
          if-no-files-found: error
