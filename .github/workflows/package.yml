name: Unsigned desktop packages
on:
  workflow_dispatch:
    inputs:
      verify_package_run:
        description: Optional existing package run for a Windows verification-only retry
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  package:
    if: inputs.verify_package_run == ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Prepare Windows native write bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm build
          node scripts/build-desktop.mjs --prepare-only
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Native write bridge build failed' }
          "GIT_VIEW_NATIVE_HELPER=$env:GITHUB_WORKSPACE\apps\desktop\src-tauri\target\debug\git-view-desktop.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: macOS full tests including HTTP transport
        if: runner.os == 'macOS'
        run: pnpm test
      - name: Windows core Git and stdio tests (HTTP fallback is POSIX only)
        if: runner.os == 'Windows'
        run: pnpm exec vitest run --exclude tests/integration/transport.test.ts
      - name: macOS desktop installation and recovery tests
        if: runner.os == 'macOS'
        run: pnpm test:install-desktop
      - run: pnpm build
      - run: node scripts/build-desktop.mjs --prepare-only
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: node scripts/build-desktop.mjs
      - run: pnpm package:desktop
      - if: runner.os == 'macOS'
        run: node scripts/verify-macos-package.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-desktop-${{ matrix.os }}
          path: dist/installers/
          if-no-files-found: error
  verify_windows:
    if: inputs.verify_package_run != ''
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the existing installer without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.verify_package_run }}
        run: |
          if ($env:PACKAGE_RUN -notmatch '^\d+$') { throw 'Package run must be a numeric GitHub Actions run ID' }
          gh run download $env:PACKAGE_RUN --name unsigned-desktop-windows-2025 --dir dist/installers
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the installer' }
      - shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-verification
          path: dist/installers/
          if-no-files-found: error
